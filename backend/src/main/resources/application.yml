spring:
  application:
    name: lekha-backend
  datasource:
    url: jdbc:postgresql://localhost:15432/lekha
    username: lekha
    password: ${LEKHA_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

lekha:
  version: @project.version@
