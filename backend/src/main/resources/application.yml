spring:
  application:
    name: lekha-backend
  datasource:
    url: jdbc:postgresql://localhost:15432/lekha
    username: lekha
    password: ${LEKHA_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

lekha:
  version: @project.version@
  ai:
    # Ollama on this computer. Nothing is sent anywhere else.
    base-url: http://127.0.0.1:11434
    model: ${LEKHA_AI_MODEL:qwen2.5:7b}
    # One batch of transactions; the first one after a while also loads the model into memory.
    timeout: 180s
