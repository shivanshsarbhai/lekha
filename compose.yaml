services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lekha
      POSTGRES_USER: lekha
      POSTGRES_PASSWORD: ${LEKHA_DB_PASSWORD:?Set LEKHA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - lekha-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lekha", "-d", "lekha"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  lekha-pgdata:
